name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

# GITHUB_TOKEN 默认只有读权限，创建 Release 需要显式申请写权限
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXE_NAME: WireGuardManager.exe
  # 发行版资产名一律 ASCII：中文在下载链接里要转义，复制传播容易乱码
  SETUP_NAME: WireGuardManager-setup.exe
  # runner 的控制台编码是 cp1252，Python 默认按它写 stdout，脚本里任何一句
  # 中文 print 都会抛 UnicodeEncodeError 直接把构建打挂（2026-11-09 真挂过一次）。
  # 构建脚本自己 reconfigure 过 stdout，这里再加一层进程级兜底。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build & Test (windows-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      # 版本号必须注入到源码里，否则 exe 里的 __version__ 永远是旧值，
      # 「检查更新」会把线上每一次构建都当成新版本，天天提示升级。
      #
      # 规则：基线取自源码里的 __version__（开发者手动维护），后面追加构建号。
      # 本地打包出来是 1.0.16，CI 出来是 1.0.16.14 —— 四段号恒大于三段号，
      # 两边编号体系不同也不会再出现"线上版本比本地还小"的倒挂。
      - name: Stamp version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $line = Select-String -Path wgmanager/__init__.py -Pattern '__version__\s*=\s*"([\d.]+)"'
            if (-not $line) { throw "wgmanager/__init__.py 里找不到 __version__" }
            # 只取前三段，防止源码里残留四段号被越加越长
            $base = ($line.Matches[0].Groups[1].Value -split '\.')[0..2] -join '.'
            $ver = "$base.${{ github.run_number }}"
          }
          Write-Host "Stamped version: $ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          python build_assets/stamp_version.py $ver
          Get-Content version.txt
          Select-String -Path wgmanager/__init__.py -Pattern "__version__"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # 启动图里印着版本号，必须在 stamp 之后生成，否则图上是旧版本
      - name: Generate splash image
        run: python build_assets/make_splash.py

      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm --clean wireguard-manager.spec

      - name: Sanity check and prepare release asset
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) { throw "No exe was produced in dist/" }
          Write-Host ("Built: {0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB))
          if ($exe.Length -lt 5MB) { throw "exe looks too small, build likely incomplete" }

          # 发行版资产用纯 ASCII 文件名，下载链接不含转义字符，复制到任何地方都不会乱码
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe.FullName "release/$env:EXE_NAME" -Force
          $hash = (Get-FileHash "release/$env:EXE_NAME" -Algorithm SHA256).Hash
          "$hash  $env:EXE_NAME" | Out-File -FilePath "release/SHA256.txt" -Encoding ascii
          # 客户端的「检查更新」直接读这个文件判断版本，比从标题里抠字符串可靠
          Copy-Item "version.txt" "release/version.txt" -Force
          Write-Host "SHA256: $hash"
          Write-Host "Version asset: $(Get-Content release/version.txt)"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireGuardManager-windows-x64
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error

      # ---- 安装包的料（onedir 布局）：只做安装包输入，不对外发布 ----
      # 必须放在单文件版的产物检查之后，否则 dist/ 里会多一层同名目录，
      # 上面那条 `Get-ChildItem dist -Filter *.exe` 就可能挑错。
      - name: Build installer payload
        run: python -m PyInstaller --noconfirm --clean --distpath build/installer-src wireguard-manager-onedir.spec

      # ---- 安装包（Inno Setup）----
      # 可选：把官方客户端 msi 一起打进去。官网在部分网络下不可达，
      # 所以这一步失败不拦构建 —— 没有 msi 只是少了那个勾选项。
      - name: Fetch WireGuard client installer (optional)
        continue-on-error: true
        run: python build_assets/fetch_wireguard_msi.py

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found, installing via choco..."
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe still missing after install" }
          Write-Host "Inno Setup ready: $iscc"

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          # 发行版资产用 ASCII 名，和 WireGuardManager.exe 保持一致的习惯
          python build_assets/make_installer.py $ver --out=WireGuardManager-setup
          $setup = Get-Item "dist/WireGuardManager-setup.exe"
          Write-Host ("Installer: {0:N1} MB" -f ($setup.Length / 1MB))
          if ($setup.Length -lt 8MB) { throw "installer looks too small" }
          Copy-Item $setup.FullName "release/WireGuardManager-setup.exe" -Force
          $h = (Get-FileHash "release/WireGuardManager-setup.exe" -Algorithm SHA256).Hash
          Add-Content -Path "release/SHA256.txt" -Value "$h  WireGuardManager-setup.exe" -Encoding ascii
          Write-Host "Setup SHA256: $h"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireGuardManager-setup-x64
          path: release/WireGuardManager-setup.exe
          retention-days: 30
          if-no-files-found: error

      # ---- 推送到 main / master：每次构建都单独留一条发行版 ----
      # 以前固定复用 tag "latest"，每次覆盖同一条，导致旧版本一个都留不下。
      # 现在 tag 用 "v1.0.<构建号>"，每条独立存在，历史可回溯。
      # 固定下载链接不受影响：GitHub 的 releases/latest/download/... 会自动
      # 解析到被标记为 latest 的那条（下面 make_latest: true 维持这个标记）。
      - name: Publish build release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          # 用 Stamp 步骤算出来的版本号，保证 tag、release 名、version.txt 三者一致
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            > 由 GitHub Actions 自动构建，无需手动操作。

            **提交**：`${{ github.sha }}`
            **构建号**：#${{ github.run_number }}
            **分支**：`${{ github.ref_name }}`

            ### 下载
            两个文件，功能完全相同，按需选一个：

            | 下载 | 启动速度 | 适合 |
            |---|---|---|
            | `WireGuardManager-setup.exe` | **约 1 秒** | **推荐**。双击安装，自动创建开始菜单和桌面快捷方式，卸载在「应用和功能」里 |
            | `WireGuardManager.exe` | 约 5 秒（每次启动要把运行库解压到临时目录） | 免安装单文件，拷走就能用；支持程序内自动更新 |

            **安装版说明**：默认只给当前用户装，全程不弹 UAC；安装位置可以自己选。
            装到 `C:\Program Files` 时配置会自动落到 `%LOCALAPPDATA%\WireGuard管理台`。
            安装包内可选带官方 WireGuard 客户端（默认不勾）。

            目标机器 **不需要安装 Python 或任何运行库**。

            - 需要 64 位 Windows 10 / 11
            - 单文件版不要放在 `C:\Program Files`（程序要往自己旁边写配置）
            - 无代码签名，SmartScreen 提示"未知发布者"时选「更多信息 → 仍要运行」

            校验值见 `SHA256.txt`。
            历史版本可以在本仓库的 Releases 页面按 tag 找到。
          files: |
            release/WireGuardManager-setup.exe
            release/WireGuardManager.exe
            release/SHA256.txt
            release/version.txt

      # ---- 打 tag（v1.0.0 这种）：发布正式版本 ----
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            版本 `${{ github.ref_name }}`，由 GitHub Actions 自动构建。

            两种下载：`WireGuardManager-setup.exe`（安装版，推荐）、
            `WireGuardManager.exe`（单文件免安装）。
            目标机器无需安装 Python。校验值见 `SHA256.txt`。
          files: |
            release/WireGuardManager-setup.exe
            release/WireGuardManager.exe
            release/SHA256.txt
            release/version.txt
